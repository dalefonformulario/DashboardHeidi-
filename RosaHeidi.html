<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalefon - Rosa (Chats)</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out',
            'spin-slow': 'spin 2s linear infinite',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#FDFDFF] dark:bg-slate-900 transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const IconSvg = ({ children, className = "w-5 h-5", size, strokeWidth = "2", ...props }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth={strokeWidth}
        strokeLinecap="round"
        strokeLinejoin="round"
        className={className}
        width={size || "24"}
        height={size || "24"}
        {...props}
      >
        {children}
      </svg>
    );

    const MessageCircle = (props) => <IconSvg {...props}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></IconSvg>;
    const ArrowLeft = (props) => <IconSvg {...props}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></IconSvg>;
    const Moon = (props) => <IconSvg {...props}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></IconSvg>;
    const Sun = (props) => <IconSvg {...props}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></IconSvg>;
    const RefreshCw = (props) => <IconSvg {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></IconSvg>;
    const Star = (props) => <IconSvg {...props}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconSvg>;

    function App() {
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [dashLoading, setDashLoading] = useState(false);
      const [dashMes, setDashMes] = useState("");
      const [llamadasRawData, setLlamadasRawData] = useState(null);
      const [fetchError, setFetchError] = useState(null);

      const fetchRealData = async () => {
        setDashLoading(true);
        setFetchError(null);
        try {
          const response = await fetch("https://script.google.com/macros/s/AKfycbyOF0suZ4INbrCBN0tQvQ3nXLe1pLUIJR5LbfjkkqtffnLhPFkU7m0VhaP3c9yYOWUp/exec");
          const json = await response.json();

          if (json.status === "success") {
            if (json.dashboard) {
              setDashMes(json.dashboard.mes || "");
              setLlamadasRawData(json.llamadas || []);
            } else if (json.data) {
              setDashMes(json.mes);
            }
          } else {
            setFetchError("Error en la estructura de datos. Verifica tu Google Sheet.");
          }
        } catch (error) {
          console.error("Error fetching data:", error);
          setFetchError("Error al conectar con Google Sheets.");
        } finally {
          setDashLoading(false);
        }
      };

      useEffect(() => {
        fetchRealData();
      }, []);

      const formatMax3 = (val) => {
        if (typeof val === 'number') return Number.isInteger(val) ? val : parseFloat(val.toFixed(3));
        if (typeof val === 'string' && !isNaN(val) && val.includes('.')) return parseFloat(parseFloat(val).toFixed(3));
        return val;
      };

      // Textos fijos oficiales para Rosa (Chats)
      const officialCriteriaTexts = [
        "Manejo de tiempos. Valor: 20 puntos.",
        "Estructura de saludo. Valor: 10 puntos",
        "Verificar la identidad del cliente. Valor: 10 puntos.",
        "Identificación de solicitud. Valor: 10 puntos.",
        "Comunicación clara. Valor: 10 puntos.",
        "Eficacia en la resolución. Valor: 20 puntos.",
        "Actitud de servicio. Valor: 15 puntos.",
        "Cierre adecuado. Valor: 5 puntos."
      ];

      return (
        <div className={`${isDarkMode ? 'dark' : ''}`}>
          <div className="min-h-screen bg-[#FDFDFF] dark:bg-slate-900 font-sans selection:bg-pink-100 selection:text-[#3C1053] transition-colors duration-300">
            
            {/* Navbar */}
            <nav className="bg-[#3C1053] dark:bg-slate-950 py-6 px-8 sticky top-0 z-50 shadow-2xl print:hidden transition-colors">
              <div className="max-w-7xl mx-auto flex justify-between items-center px-4">
                <a href="index.html" className="flex flex-col cursor-pointer hover:opacity-90 transition-opacity">
                  <span className="text-white text-4xl font-bold lowercase tracking-tighter leading-none">
                    dalefon<span className="text-[12px] relative -top-3 font-black">®</span>
                  </span>
                  <span className="text-[#FF00FF] text-[10px] font-bold tracking-[0.25em] uppercase mt-1.5 ml-1">
                    la telefonía morada
                  </span>
                </a>
                <button
                  onClick={() => setIsDarkMode(!isDarkMode)}
                  className="text-white p-2 rounded-full hover:bg-white/20 transition-all focus:outline-none"
                >
                  {isDarkMode ? <Sun size={24} /> : <Moon size={24} />}
                </button>
              </div>
            </nav>

            {/* Main Content */}
            <main className="py-12 animate-fade-in max-w-[95%] mx-auto px-4 pb-20">
              <div className="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4 print:hidden">
                <a href="index.html" className="flex w-max items-center text-gray-500 dark:text-gray-400 font-bold hover:text-[#FF00FF] transition-colors">
                  <ArrowLeft className="mr-2 w-6 h-6" /> Volver al Dashboard
                </a>

                <button
                  onClick={fetchRealData}
                  disabled={dashLoading}
                  className="flex w-max items-center bg-white dark:bg-slate-800 border-2 border-pink-100 dark:border-slate-700 px-6 py-3 rounded-full text-[#C51162] dark:text-pink-300 font-black text-sm uppercase tracking-wider hover:shadow-lg hover:border-[#FF00FF] transition-all disabled:opacity-50"
                >
                  actualiza tus datos dalefonescos
                  <RefreshCw className={`ml-3 w-5 h-5 text-[#FF00FF] ${dashLoading ? 'animate-spin' : ''}`} />
                </button>
              </div>

              {dashLoading && (!llamadasRawData || llamadasRawData.length === 0) ? (
                <div className="flex flex-col items-center justify-center py-20 text-pink-600">
                  <RefreshCw className="animate-spin-slow w-12 h-12 mb-4" />
                  <p className="font-bold">Descargando matriz de chats...</p>
                </div>
              ) : fetchError ? (
                <div className="text-center py-10 text-red-500 font-bold">{fetchError}</div>
              ) : !llamadasRawData || llamadasRawData.length === 0 ? (
                <div className="text-center py-20 bg-white dark:bg-slate-800 rounded-3xl shadow-sm border border-gray-100">
                  <p className="text-gray-500 font-bold text-lg">Aún no hay datos de chats cargados.</p>
                </div>
              ) : (
                (() => {
                  try {
                    // CORTAMOS LAS FILAS DE ROSA (Filas 1 a 13 en Excel = Indices 0 a 12 en JS)
                    const tableData = llamadasRawData.slice(0, 13);

                    let execName = "Ejecutivo";
                    const nameRow = tableData[1] || [];
                    const foundName = nameRow.find(c => typeof c === 'string' && c.trim() !== "" && c.toLowerCase() !== "nombre del ejecutivo");
                    if (foundName) execName = foundName;

                    const headerRow = tableData[0] || [];
                    const weeks = [5, 9, 13, 17].map((idx, i) => {
                      const val = headerRow[idx] || "";
                      return val.split(" del ")[0] || `Semana ${i + 1}`;
                    });

                    // Criterios para Rosa
                    const criteriaRows = tableData.slice(3, 11);
                    const linkRow = tableData[2] || [];
                    const totalCallRow = tableData[11] || [];
                    const totalWeekRow = tableData[12] || [];

                    // CALCULAR PROMEDIO GLOBAL
                    let sumScore = 0;
                    let validWeeks = 0;
                    [5, 9, 13, 17].forEach(startIdx => {
                      let val = totalWeekRow[startIdx] || totalWeekRow[startIdx + 1] || totalWeekRow[startIdx + 2];
                      if (typeof val === 'number') {
                        sumScore += val;
                        validWeeks++;
                      } else if (typeof val === 'string' && val.includes('%')) {
                        sumScore += parseFloat(val) / 100;
                        validWeeks++;
                      }
                    });
                    
                    const finalAverage = validWeeks > 0 ? parseFloat((sumScore / validWeeks) * 100).toFixed(2) + '%' : '0.00%';

                    return (
                      <div className="space-y-8 animate-fade-in relative">
                        {/* INSIGNIA PROMEDIO GLOBAL */}
                        <div className="absolute top-0 right-0 hidden md:flex bg-white dark:bg-slate-800 border-2 border-[#FF00FF] shadow-xl rounded-2xl p-4 items-center space-x-4 transform hover:scale-105 transition-transform z-10 group">
                          <div className="bg-[#3C1053] p-3 rounded-xl text-[#FF00FF] group-hover:bg-[#FF00FF] group-hover:text-white transition-colors duration-300">
                            <Star size={24} className="animate-pulse-slow" fill="currentColor" />
                          </div>
                          <div>
                            <p className="text-[10px] font-black text-gray-500 uppercase tracking-widest leading-none">Calificación Global</p>
                            <p className="text-[10px] font-black text-gray-500 uppercase tracking-widest leading-none mb-1">de Chats</p>
                            <p className="text-3xl font-black text-[#3C1053] dark:text-white leading-none">{finalAverage}</p>
                          </div>
                        </div>

                        {/* TÍTULOS ELEGANTES */}
                        <div className="text-center md:text-left space-y-2 mb-10 pt-4 md:pt-0 pr-0 md:pr-64">
                          <h2 className="text-4xl md:text-5xl font-black text-[#3C1053] dark:text-fuchsia-50 tracking-tighter">
                            Bienvenida {execName}
                          </h2>
                          <h3 className="text-2xl font-bold text-gray-500 dark:text-gray-400">
                            Este es tu reporte de chats del mes de <span className="text-[#FF00FF] font-black uppercase">{dashMes || 'Mes no detectado'}</span>
                          </h3>
                          
                          {/* Versión móvil del promedio */}
                          <div className="md:hidden mt-6 flex justify-center">
                             <div className="bg-white dark:bg-slate-800 border-2 border-[#FF00FF] shadow-lg rounded-2xl p-4 flex items-center space-x-4">
                                <div className="bg-[#3C1053] p-2 rounded-xl text-[#FF00FF]">
                                  <Star size={20} fill="currentColor" />
                                </div>
                                <div className="text-left">
                                  <p className="text-[9px] font-black text-gray-500 uppercase tracking-widest leading-none">Calificación Global</p>
                                  <p className="text-2xl font-black text-[#3C1053] dark:text-white leading-none mt-1">{finalAverage}</p>
                                </div>
                             </div>
                          </div>
                        </div>

                        {/* TABLA PRINCIPAL */}
                        <div className="bg-white dark:bg-slate-800 rounded-[2rem] shadow-2xl border-t-[8px] border-[#FF00FF] overflow-hidden">
                          <div className="overflow-x-auto custom-scrollbar pb-2">
                            <table className="w-full text-[13px] md:text-sm border-collapse min-w-[1200px]">
                              <thead>
                                <tr>
                                  <th colSpan="2" className="bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700 min-w-[350px]"></th>
                                  <th colSpan="3" className="bg-[#C51162] text-white font-bold py-4 text-center text-lg rounded-tl-2xl">{weeks[0]}</th>
                                  <th className="w-2 bg-gray-50 dark:bg-slate-900 border-b border-gray-200 dark:border-slate-700"></th>
                                  <th colSpan="3" className="bg-[#C51162] text-white font-bold py-4 text-center text-lg">{weeks[1]}</th>
                                  <th className="w-2 bg-gray-50 dark:bg-slate-900 border-b border-gray-200 dark:border-slate-700"></th>
                                  <th colSpan="3" className="bg-[#C51162] text-white font-bold py-4 text-center text-lg">{weeks[2]}</th>
                                  <th className="w-2 bg-gray-50 dark:bg-slate-900 border-b border-gray-200 dark:border-slate-700"></th>
                                  <th colSpan="3" className="bg-[#C51162] text-white font-bold py-4 text-center text-lg rounded-tr-2xl">{weeks[3]}</th>
                                </tr>
                                <tr>
                                  <th colSpan="2" className="bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700"></th>
                                  {[5, 9, 13, 17].map((startIdx, i) => (
                                    <React.Fragment key={i}>
                                      <th className="bg-[#3C1053] text-pink-200 font-bold text-xs uppercase tracking-wider text-center py-3 px-2 border-r border-pink-900/50 w-24">Chat 1</th>
                                      <th className="bg-[#3C1053] text-pink-200 font-bold text-xs uppercase tracking-wider text-center py-3 px-2 border-r border-pink-900/50 w-24">Chat 2</th>
                                      <th className="bg-[#3C1053] text-pink-200 font-bold text-xs uppercase tracking-wider text-center py-3 px-2 w-24">Chat 3</th>
                                      {i < 3 && <th className="w-2 bg-gray-50 dark:bg-slate-900 border-b border-gray-200 dark:border-slate-700"></th>}
                                    </React.Fragment>
                                  ))}
                                </tr>
                                <tr>
                                  <th colSpan="2" className="bg-gray-50 dark:bg-slate-800/80 border-b border-gray-200 dark:border-slate-700 py-4 px-6 text-left font-black text-[#3C1053] dark:text-pink-300 uppercase tracking-widest text-xs">
                                    Enlaces de Chat
                                  </th>
                                  {[5, 9, 13, 17].map((startIdx, i) => (
                                    <React.Fragment key={i}>
                                      {[0, 1, 2].map(offset => {
                                        const url = linkRow[startIdx + offset];
                                        const isUrl = typeof url === 'string' && url.startsWith('http');
                                        return (
                                          <td key={offset} className="bg-pink-50/50 dark:bg-pink-900/10 text-center py-3 px-2 border-r border-pink-100 dark:border-pink-900/30 border-b border-pink-100 dark:border-pink-900/30">
                                            {isUrl ? (
                                              <a href={url} target="_blank" rel="noreferrer" className="text-[#C51162] dark:text-[#FF00FF] hover:text-pink-600 underline font-bold text-xs bg-pink-100/50 dark:bg-pink-900/50 py-1.5 px-3 rounded-lg inline-flex items-center transition-colors shadow-sm">
                                                Abrir
                                              </a>
                                            ) : <span className="text-gray-400 text-xs">-</span>}
                                          </td>
                                        )
                                      })}
                                      {i < 3 && <td className="w-2 bg-gray-100 dark:bg-slate-900 border-b border-gray-200 dark:border-slate-700"></td>}
                                    </React.Fragment>
                                  ))}
                                </tr>
                              </thead>
                              <tbody>
                                {criteriaRows.map((row, idx) => {
                                  // Forzamos el texto oficial basado en el índice de la fila
                                  const text = officialCriteriaTexts[idx] || "";
                                  const num = `No. ${idx + 1}`;

                                  return (
                                    <tr key={idx} className="border-b border-gray-100 dark:border-slate-700 hover:bg-gray-50/50 dark:hover:bg-slate-700/30 transition-colors">
                                      <td colSpan="2" className="p-4 border-r border-gray-200 dark:border-slate-700">
                                        <div className="flex items-start space-x-4 bg-white dark:bg-slate-800 p-4 rounded-2xl border border-gray-200 dark:border-slate-600 shadow-sm hover:border-[#FF00FF] group transition-all cursor-default max-w-sm">
                                          <div className="bg-gradient-to-br from-[#3C1053] to-[#5a187d] group-hover:from-[#FF00FF] group-hover:to-[#C51162] text-white font-black text-[12px] w-12 h-12 rounded-xl shadow-md flex items-center justify-center flex-shrink-0 transition-colors duration-300">
                                            {num}
                                          </div>
                                          <span className="text-[13px] font-medium text-gray-700 dark:text-gray-300 leading-snug break-words overflow-hidden self-center">{text}</span>
                                        </div>
                                      </td>
                                      {[5, 9, 13, 17].map((startIdx, i) => (
                                        <React.Fragment key={i}>
                                          {[0, 1, 2].map(offset => (
                                            <td key={offset} className="text-center font-bold text-gray-700 dark:text-gray-300 border-r border-gray-100 dark:border-slate-700 p-3 bg-white dark:bg-slate-800/50">
                                              {formatMax3(row[startIdx + offset])}
                                            </td>
                                          ))}
                                          {i < 3 && <td className="w-2 bg-gray-100 dark:bg-slate-900"></td>}
                                        </React.Fragment>
                                      ))}
                                    </tr>
                                  )
                                })}

                                <tr className="bg-[#f8e1ec] dark:bg-pink-900/40 border-t-[4px] border-pink-300 dark:border-pink-500/50">
                                  <td colSpan="2" className="p-5 border-r border-pink-200 dark:border-pink-800 font-black text-[#3C1053] dark:text-pink-100 text-right uppercase tracking-wider text-sm">
                                    Puntaje total por chat
                                  </td>
                                  {[5, 9, 13, 17].map((startIdx, i) => (
                                    <React.Fragment key={i}>
                                      {[0, 1, 2].map(offset => (
                                        <td key={offset} className="text-center font-black text-[#3C1053] dark:text-pink-100 border-r border-pink-200 dark:border-pink-800 p-3 text-lg">
                                          {formatMax3(totalCallRow[startIdx + offset])}
                                        </td>
                                      ))}
                                      {i < 3 && <td className="w-2 bg-gray-100 dark:bg-slate-900 border-r border-pink-200 dark:border-pink-800"></td>}
                                    </React.Fragment>
                                  ))}
                                </tr>

                                <tr className="bg-[#3C1053] dark:bg-[#2A0B3A] border-t-[6px] border-[#C51162]">
                                  <td colSpan="2" className="p-6 border-r border-pink-900/50 font-black text-white text-right uppercase tracking-widest text-sm">
                                    Puntaje total por semana
                                  </td>
                                  {[5, 9, 13, 17].map((startIdx, i) => {
                                    let val = totalWeekRow[startIdx] || totalWeekRow[startIdx + 1] || totalWeekRow[startIdx + 2];
                                    if (typeof val === 'number') { val = parseFloat((val * 100).toFixed(2)) + '%'; }
                                    return (
                                      <React.Fragment key={i}>
                                        <td colSpan="3" className="text-center font-black text-[#FF0000] dark:text-red-500 p-5 text-2xl border-r border-pink-900/50 tracking-wider shadow-inner bg-black/10">
                                          {val}
                                        </td>
                                        {i < 3 && <td className="w-2 bg-gray-800 dark:bg-slate-900 border-r border-pink-900/50"></td>}
                                      </React.Fragment>
                                    )
                                  })}
                                </tr>
                              </tbody>
                            </table>
                          </div>
                        </div>
                      </div>
                    );
                  } catch (error) {
                    return <div className="text-center font-bold text-red-500 p-10 bg-red-50 rounded-2xl border border-red-200 m-10">Ocurrió un error al procesar la tabla: <br /> <strong>{error.message}</strong></div>;
                  }
                })()
              )}

              <style>{`
                .custom-scrollbar::-webkit-scrollbar { height: 12px; }
                .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
                .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; border: 3px solid #f1f5f9; }
                .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #FF00FF; }
                .dark .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
                .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border: 3px solid #0f172a; }
              `}</style>
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
