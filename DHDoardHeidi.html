<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalefon - Mi Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out',
            'spin-slow': 'spin 2s linear infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#FDFDFF] dark:bg-slate-900 transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const IconSvg = ({ children, className = "w-5 h-5", size, strokeWidth = "2", ...props }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth={strokeWidth}
        strokeLinecap="round"
        strokeLinejoin="round"
        className={className}
        width={size || "24"}
        height={size || "24"}
        {...props}
      >
        {children}
      </svg>
    );

    const Moon = (props) => <IconSvg {...props}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></IconSvg>;
    const Sun = (props) => <IconSvg {...props}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></IconSvg>;
    const RefreshCw = (props) => <IconSvg {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></IconSvg>;

    function App() {
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [dashLoading, setDashLoading] = useState(false);
      const [dashData, setDashData] = useState(null);
      const [dashMes, setDashMes] = useState("");
      const [fetchError, setFetchError] = useState(null);

      const fetchRealData = async () => {
        setDashLoading(true);
        setFetchError(null);
        try {
          const response = await fetch("https://script.google.com/macros/s/AKfycbyOF0suZ4INbrCBN0tQvQ3nXLe1pLUIJR5LbfjkkqtffnLhPFkU7m0VhaP3c9yYOWUp/exec");
          const json = await response.json();

          if (json.status === "success") {
            if (json.dashboard) {
              setDashData(json.dashboard.data || []);
              setDashMes(json.dashboard.mes || "");
            } else if (json.data) {
              setDashData(json.data);
              setDashMes(json.mes);
            }
          } else {
            setFetchError("Error en la estructura de datos. Verifica tu Google Sheet.");
          }
        } catch (error) {
          console.error("Error fetching data:", error);
          setFetchError("Error al conectar con Google Sheets. Verifica los permisos de tu Script.");
        } finally {
          setDashLoading(false);
        }
      };

      useEffect(() => {
        if (!dashData) {
          fetchRealData();
        }
      }, []);

      const formatMax3 = (val) => {
        if (typeof val === 'number') {
          return Number.isInteger(val) ? val : parseFloat(val.toFixed(3));
        }
        if (typeof val === 'string' && !isNaN(val) && val.includes('.')) {
          return parseFloat(parseFloat(val).toFixed(3));
        }
        return val || '0';
      };

      return (
        <div className={`${isDarkMode ? 'dark' : ''}`}>
          <div className="min-h-screen bg-[#FDFDFF] dark:bg-slate-900 font-sans selection:bg-cyan-100 selection:text-[#3C1053] transition-colors duration-300">
            
            {/* Navbar */}
            <nav className="bg-[#3C1053] dark:bg-slate-950 py-6 px-8 sticky top-0 z-50 shadow-2xl print:hidden transition-colors">
              <div className="max-w-7xl mx-auto flex justify-between items-center px-4">
                <div className="flex flex-col">
                  <span className="text-white text-4xl font-bold lowercase tracking-tighter leading-none">
                    dalefon<span className="text-[12px] relative -top-3 font-black">®</span>
                  </span>
                  <span className="text-cyan-400 text-[10px] font-bold tracking-[0.25em] uppercase mt-1.5 ml-1">
                    la telefonía morada
                  </span>
                </div>
                <button
                  onClick={() => setIsDarkMode(!isDarkMode)}
                  className="text-white p-2 rounded-full hover:bg-white/20 transition-all focus:outline-none"
                >
                  {isDarkMode ? <Sun size={24} /> : <Moon size={24} />}
                </button>
              </div>
            </nav>

            {/* Dashboard Content */}
            <main className="py-12 animate-fade-in max-w-6xl mx-auto px-4 pb-20">
              <div className="flex justify-end mb-8 print:hidden">
                <button
                  onClick={fetchRealData}
                  disabled={dashLoading}
                  className="flex items-center bg-white dark:bg-slate-800 border-2 border-indigo-100 dark:border-slate-700 px-6 py-3 rounded-full text-[#3C1053] dark:text-fuchsia-300 font-black text-sm uppercase tracking-wider hover:shadow-lg hover:border-[#7B1FA2] transition-all disabled:opacity-50"
                >
                  actualiza tus datos
                  <RefreshCw className={`ml-3 w-5 h-5 text-[#7B1FA2] dark:text-fuchsia-400 ${dashLoading ? 'animate-spin' : ''}`} />
                </button>
              </div>

              {dashLoading && !dashData ? (
                <div className="flex flex-col items-center justify-center py-20 text-emerald-600">
                  <RefreshCw className="animate-spin-slow w-12 h-12 mb-4" />
                  <p className="font-bold">Descargando datos desde Google Sheets...</p>
                </div>
              ) : fetchError ? (
                <div className="text-center py-10 text-red-500 font-bold">{fetchError}</div>
              ) : dashData && dashData.length > 0 ? (
                (() => {
                  const targetRow = dashData.find(row => row["Nombre"] === "Heidi Nataly Cienfuegos Flores") || dashData[0] || {};

                  let colB_val = targetRow["Puntualidad"] !== undefined ? targetRow["Puntualidad"] : '0';
                  if (typeof colB_val === 'number') { colB_val = parseFloat((colB_val * 100).toFixed(2)) + '%'; }

                  const colH_val = formatMax3(targetRow["vacaciones"]);
                  const colI_val = formatMax3(targetRow["dias economicos"]);
                  const colD_val = formatMax3(targetRow["Minimo de asistencias"]);
                  const colE_val = formatMax3(targetRow["asistencias realizadas"]);
                  const colC_val = formatMax3(targetRow["Faltas"]);
                  const metaLlamadas = formatMax3(targetRow["Meta de llamadas"] || 50); 
                  const llamadasLlevo = formatMax3(targetRow["Llamadas que llevo"] || targetRow["Meta de llamadas"] || '0'); 
                  
                  let colG_val = targetRow["Calf del cliente"] !== undefined ? targetRow["Calf del cliente"] : '0';
                  if (typeof colG_val === 'number') { colG_val = parseFloat(colG_val.toFixed(3)); }
                  else { colG_val = formatMax3(colG_val); }

                  return (
                    <div className="space-y-12">
                      <div className="text-center space-y-4">
                        <h2 className="text-4xl md:text-5xl font-black text-[#3C1053] dark:text-fuchsia-50 tracking-tighter break-words">
                          Bienvenida Heidi Nataly Cienfuegos Flores
                        </h2>
                        <h3 className="text-2xl font-bold text-gray-500 dark:text-gray-400">
                          Este es tu dashboard del mes de <span className="text-[#00E5FF] font-black uppercase">{dashMes || 'Mes no detectado'}</span>
                        </h3>
                      </div>

                      <div className="space-y-6 md:space-y-8">
                        {/* Fila 1 */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                          <div className="bg-[#3C1053] rounded-[2rem] p-6 shadow-xl text-center transform hover:-translate-y-1 transition-transform flex flex-col justify-center overflow-hidden">
                            <p className="text-fuchsia-200 text-xs md:text-sm font-bold uppercase tracking-widest mb-2 text-balance break-words">Puntualidad</p>
                            <p className="text-4xl md:text-5xl font-black text-white truncate">{colB_val}</p>
                          </div>
                          <div className="bg-gradient-to-br from-amber-400 to-orange-500 rounded-[2rem] p-6 shadow-xl text-center transform hover:-translate-y-1 transition-transform flex flex-col justify-center overflow-hidden">
                            <p className="text-amber-100 text-xs md:text-sm font-bold uppercase tracking-widest mb-2 text-balance break-words">Vacaciones</p>
                            <p className="text-4xl md:text-5xl font-black text-white truncate">{colH_val}</p>
                          </div>
                          <div className="bg-gradient-to-br from-sky-400 to-blue-600 rounded-[2rem] p-6 shadow-xl text-center transform hover:-translate-y-1 transition-transform flex flex-col justify-center overflow-hidden">
                            <p className="text-sky-100 text-xs md:text-sm font-bold uppercase tracking-widest mb-2 text-balance break-words">Días Económicos</p>
                            <p className="text-4xl md:text-5xl font-black text-white truncate">{colI_val}</p>
                          </div>
                        </div>

                        {/* Fila 2 */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                          <div className="bg-gradient-to-br from-cyan-500 to-blue-600 rounded-[2rem] p-6 shadow-xl text-center flex flex-col justify-center transform hover:-translate-y-1 transition-transform overflow-hidden">
                            <p className="text-cyan-100 text-xs md:text-sm font-bold uppercase tracking-widest mb-2 text-balance break-words">Mínimo de Asistencias</p>
                            <p className="text-4xl md:text-5xl font-black text-white truncate">{colD_val}</p>
                          </div>
                          <div className="bg-gradient-to-br from-emerald-400 to-green-600 rounded-[2rem] p-6 shadow-xl text-center flex flex-col justify-center transform hover:-translate-y-1 transition-transform overflow-hidden">
                            <p className="text-emerald-100 text-xs md:text-sm font-bold uppercase tracking-widest mb-2 text-balance break-words">Asistencias Realizadas</p>
                            <p className="text-4xl md:text-5xl font-black text-white truncate">{colE_val}</p>
                          </div>
                          <div className="bg-gradient-to-br from-rose-500 to-red-600 rounded-[2rem] p-6 shadow-xl text-center flex flex-col justify-center transform hover:-translate-y-1 transition-transform overflow-hidden">
                            <p className="text-rose-100 text-xs md:text-sm font-bold uppercase tracking-widest mb-2 text-balance break-words">Faltas</p>
                            <p className="text-4xl md:text-5xl font-black text-white truncate">{colC_val}</p>
                          </div>
                        </div>

                        {/* Fila 3 */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                          <div className="bg-white dark:bg-slate-800 border-4 border-indigo-100 dark:border-slate-700 rounded-[2rem] p-6 shadow-lg text-center flex flex-col justify-center transform hover:-translate-y-1 transition-transform overflow-hidden">
                            <p className="text-indigo-400 dark:text-indigo-300 text-xs md:text-sm font-bold uppercase tracking-widest mb-2 text-balance break-words">Meta de Llamadas</p>
                            <p className="text-4xl md:text-5xl font-black text-[#3C1053] dark:text-white truncate">{metaLlamadas}</p>
                          </div>
                          <div className="bg-white dark:bg-slate-800 border-4 border-[#FF00FF]/20 dark:border-[#FF00FF]/30 rounded-[2rem] p-6 shadow-lg text-center flex flex-col justify-center transform hover:-translate-y-1 transition-transform overflow-hidden">
                            <p className="text-[#C51162] dark:text-pink-400 text-xs md:text-sm font-bold uppercase tracking-widest mb-2 text-balance break-words">Llamadas que llevo</p>
                            <p className="text-4xl md:text-5xl font-black text-[#3C1053] dark:text-white truncate">{llamadasLlevo}</p>
                          </div>
                          <div className="bg-[#3C1053] rounded-[2rem] p-6 shadow-xl text-center transform hover:-translate-y-1 transition-transform flex flex-col justify-center overflow-hidden border-4 border-[#00E5FF]/30">
                            <p className="text-cyan-300 text-xs md:text-sm font-bold uppercase tracking-widest mb-2 text-balance break-words">Calificación del Cliente</p>
                            <p className="text-4xl md:text-5xl font-black text-[#00E5FF] truncate">{colG_val}</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })()
              ) : (
                <div className="text-center py-10 text-gray-500 font-bold">La hoja 'dashboard' está vacía o no tiene el formato correcto.</div>
              )}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
